name: Build, sign and upload to GitHub Releases

on:
  push:
    tags:
      - 'Skycast-*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Save version name
        shell: bash
        run: |
          echo 'VERSION_NAME<<EOF' >> "$GITHUB_ENV"
          grep versionName app/build.gradle.kts | cut -d '"' -f2 | head -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save version code
        shell: bash
        run: |
          echo 'VERSION_CODE<<EOF' >> "$GITHUB_ENV"
          grep versionCode app/build.gradle.kts | grep -Eo '[0-9]+' | tail -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save changelog
        shell: bash
        run: |
          CHANGELOG_CONTENT=""
          if [ -f "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" ]; then
            CHANGELOG_CONTENT=$(cat "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt")
          else
            CHANGELOG_CONTENT="Release Skycast-${VERSION_NAME}"
          fi
          
          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG_CONTENT"
            echo ""
            echo "---"
            echo "🌐 **GitHub Page**: https://saurabhkundu1.github.io/Applify/"
            echo "📱 **F-Droid Repo**: https://saurabhkundu1.github.io/Applify/repo"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Decode Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY_BASE64 || secrets.ENCODED_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release.keystore
            if [ -s app/release.keystore ]; then
              echo "Keystore successfully decoded to app/release.keystore."
            else
              echo "::warning::KEYSTORE_BASE64 secret was provided but decoded to an empty file."
            fi
          else
            echo "::warning::KEYSTORE_BASE64 secret not found in GitHub Repository Secrets. Building unsigned release APK."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Release APK
        env:
          KEYSTORE_FILE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Locate Output APK
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Found release APK at: $APK_PATH"

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="Skycast-${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.APK_PATH }}
          body: ${{ env.CHANGELOG }}
          tag: ${{ env.RELEASE_TAG }}
          release_name: Skycast-${{ env.VERSION_NAME }}
          asset_name: skycast-${{ env.VERSION_NAME }}.apk

      - name: Notify Applify F-Droid Repo
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN || secrets.REPOSITORY_DISPATCH_TOKEN }}
        run: |
          DISPATCH_URL="https://api.github.com/repos/saurabhkundu1/Applify/dispatches"
          DOWNLOAD_URL="https://github.com/saurabhkundu1/skycast-weather/releases/download/${RELEASE_TAG}/skycast-${VERSION_NAME}.apk"

          PAYLOAD=$(cat <<EOF
          {
            "event_type": "new_release",
            "client_payload": {
              "source_repo": "saurabhkundu1/skycast-weather",
              "package_name": "com.applify.skycast",
              "version": "${VERSION_NAME}",
              "version_code": "${VERSION_CODE}",
              "tag": "${RELEASE_TAG}",
              "asset_name": "skycast-${VERSION_NAME}.apk",
              "app": "com.applify.skycast",
              "version_name": "${VERSION_NAME}",
              "tag_name": "${RELEASE_TAG}",
              "apk_name": "skycast-${VERSION_NAME}.apk",
              "download_url": "${DOWNLOAD_URL}"
            }
          }
          EOF
          )

          TOKEN="${PAT_TOKEN}"

          if [ -z "$TOKEN" ]; then
            echo "::warning::PAT_TOKEN or REPOSITORY_DISPATCH_TOKEN is not configured in repository secrets."
            echo "::warning::To enable automatic F-Droid repository updates, create a GitHub Personal Access Token with repo scope and save it as PAT_TOKEN secret."
            exit 0
          fi

          echo "Sending repository_dispatch event to Applify ($DISPATCH_URL)..."
          HTTP_STATUS=$(curl -s -o response_body.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $TOKEN" \
            "$DISPATCH_URL" \
            -d "$PAYLOAD")

          echo "Dispatch response HTTP code: $HTTP_STATUS"
          cat response_body.txt

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully dispatched new_release event to Applify repository."
          else
            echo "::error::Failed to send repository_dispatch event to Applify (HTTP $HTTP_STATUS)."
            exit 1
          fi
