name: Build, sign and upload to GitHub Releases

on:
  push:
    tags:
      - 'Skycast-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and upload to GitHub Releases
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGE_NAME: com.applify.skycast
      EXPECTED_SIGNER_SHA256: 8873C9944377ED68DCDB98C5F1FDCCE10B4BD8359DA0271CC33931DF58EE97E7

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate replacement signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: skycast-recovery
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN || secrets.REPOSITORY_DISPATCH_TOKEN || secrets.GH_PAT }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEYSTORE_ALIAS:?KEYSTORE_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
          : "${PAT_TOKEN:?A repository dispatch token is required}"
          [[ "$EXPECTED_SIGNER_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          [[ "${EXPECTED_SIGNER_SHA256^^}" != "DE62E0D386DB9B6FC616ADF6573F458AAC8D04F873007C73B8585FBEEF0960255" ]]

      - name: Decode replacement keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: skycast-recovery
          EXPECTED_SIGNER_SHA256: 8873C9944377ED68DCDB98C5F1FDCCE10B4BD8359DA0271CC33931DF58EE97E7
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release.keystore
          test -s app/release.keystore
          actual="$(keytool -list -v -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          printf 'Decoded keystore certificate SHA-256: %s\n' "$actual"
          test -n "$actual"
          test "$actual" = "$expected"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble signed APK
        env:
          KEYSTORE_FILE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: skycast-recovery
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release identity and signer
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" | grep -F "package: name='$PACKAGE_NAME'"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/apksigner.txt"
          test "$(grep -Ec '^Signer #[0-9]+:?[[:space:]]+certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt")" = 1
          actual="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected"
          test "$actual" != "DE62E0D386DB9B6FC616ADF6573F458AAC8D04F873007C73B8585FBEEF0960255"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          cp "$APK_PATH" "skycast-${version_name}.apk"
          sha256sum "skycast-${version_name}.apk" > SHA256SUMS.txt
          rm -f app/release.keystore

      - name: Resolve release metadata
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" && test -n "$version_code"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="Skycast-${version_name}"
          else
            tag="$TAG_NAME"
          fi
          [[ "$tag" =~ ^Skycast-[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          gh release create "$TAG_NAME" "skycast-${VERSION_NAME}.apk" SHA256SUMS.txt \
            --title "Skycast ${VERSION_NAME}" \
            --notes "Skycast keeps package ID com.applify.skycast and now uses its replacement signing key. Uninstall the previous copy before installing this release; saved places and preferences may need to be set up again."

      - name: Notify Applify F-Droid repository
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN || secrets.REPOSITORY_DISPATCH_TOKEN || secrets.GH_PAT }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          asset_name="skycast-${VERSION_NAME}.apk"
          payload="$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg version "$VERSION_NAME" \
            --arg code "$VERSION_CODE" \
            --arg asset "$asset_name" \
            --arg package "$PACKAGE_NAME" \
            '{event_type:"new_release",client_payload:{source_repo:"saurabhkundu1/skycast-weather",package_name:$package,version:$version,version_code:$code,tag:$tag,asset_name:$asset}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            https://api.github.com/repos/saurabhkundu1/Applify/dispatches
