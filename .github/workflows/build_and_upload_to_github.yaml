name: Build, sign and upload to GitHub Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Save version name
        shell: bash
        run: |
          echo 'VERSION_NAME<<EOF' >> "$GITHUB_ENV"
          grep versionName app/build.gradle.kts | cut -d '"' -f2 | head -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save version code
        shell: bash
        run: |
          echo 'VERSION_CODE<<EOF' >> "$GITHUB_ENV"
          grep versionCode app/build.gradle.kts | grep -Eo '[0-9]+' | tail -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save changelog
        shell: bash
        run: |
          {
            echo 'CHANGELOG<<EOF'
            cat "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" 2>/dev/null || echo "Release ${VERSION_NAME}"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Save installed BUILD_TOOLS_VERSION
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | grep -E '^(34|35)\.' | tail -n 1 || echo "35.0.0")
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Sign release
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload APK to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.sign_release.outputs.signedReleaseFile }}
          body: ${{ env.CHANGELOG }}
          tag: ${{ github.ref_name }}
          asset_name: skycast-${{ env.VERSION_NAME }}.apk
