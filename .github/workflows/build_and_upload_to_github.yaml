name: Build, sign and upload to GitHub Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Save version name
        shell: bash
        run: |
          echo 'VERSION_NAME<<EOF' >> "$GITHUB_ENV"
          grep versionName app/build.gradle.kts | cut -d '"' -f2 | head -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save version code
        shell: bash
        run: |
          echo 'VERSION_CODE<<EOF' >> "$GITHUB_ENV"
          grep versionCode app/build.gradle.kts | grep -Eo '[0-9]+' | tail -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save changelog
        shell: bash
        run: |
          {
            echo 'CHANGELOG<<EOF'
            cat "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" 2>/dev/null || echo "Release ${VERSION_NAME}"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Decode Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or empty! Please add KEYSTORE_BASE64 to GitHub Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "::error::Decoded keystore file is empty! Check KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore successfully decoded to app/release.keystore."

      - name: Validate Keystore Credentials
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is missing or empty! Please add KEYSTORE_PASSWORD to GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error::KEYSTORE_ALIAS secret is missing or empty! Please add KEYSTORE_ALIAS to GitHub Repository Secrets."
            exit 1
          fi
          echo "Keystore credentials verified."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Release APK (Signed via Gradle)
        env:
          KEYSTORE_FILE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/app-release.apk
          body: ${{ env.CHANGELOG }}
          tag: ${{ github.ref_name }}
          asset_name: skycast-${{ env.VERSION_NAME }}.apk
