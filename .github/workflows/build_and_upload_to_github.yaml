```yaml
name: Build, sign and upload to GitHub Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Save version name
        shell: bash
        run: |
          echo 'VERSION_NAME<<EOF' >> "$GITHUB_ENV"
          grep versionName app/build.gradle.kts | cut -d '"' -f2 | head -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save version code
        shell: bash
        run: |
          echo 'VERSION_CODE<<EOF' >> "$GITHUB_ENV"
          grep versionCode app/build.gradle.kts | grep -Eo '[0-9]+' | tail -n 1 >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Save changelog
        shell: bash
        run: |
          {
            echo 'CHANGELOG<<EOF'
            cat "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Verify Android Build Tools
        shell: bash
        run: |
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          echo "Build Tools 36.0.0 verified."

      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Sign release
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Upload APK to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.sign_release.outputs.signedReleaseFile }}
          body: ${{ env.CHANGELOG }}
          tag: ${{ env.VERSION_NAME }}
          asset_name: skycast-${{ env.VERSION_NAME }}.apk
```
